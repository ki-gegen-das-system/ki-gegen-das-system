name: Börsen-Bert

on:
  schedule:
    # Mo–Fr zwischen 13:00 und 21:59 UTC (deckt US-Börsenzeiten ab).
    # Jeder Lauf bleibt bis zu 58 Minuten wach und prüft alle 5 Minuten.
    # Ein neuer Lauf wartet, bis der alte fertig ist (concurrency).
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch: {}   # erlaubt "Run workflow" per Hand

permissions:
  contents: write

concurrency:
  group: daten-speichern
  cancel-in-progress: false

jobs:
  handeln:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Bert handelt
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 -u bert.py --minuten 58

      - name: Daten speichern
        if: always()
        run: |
          git config user.name "boersen-bert"
          git config user.email "boersen-bert@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Bert: Update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
