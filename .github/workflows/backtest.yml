name: Backtest

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  testen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Backtest auf echten Kursen
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python3 -u backtest.py
      - name: Ergebnis speichern
        run: |
          git config user.name "boersen-bert"
          git config user.email "boersen-bert@users.noreply.github.com"
          git add data/backtest
          if git diff --cached --quiet; then echo "Nichts Neues."; exit 0; fi
          git commit -m "Backtest: Ergebnis $(date -u +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
