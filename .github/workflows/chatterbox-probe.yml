name: Stimmproben Chatterbox

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stimme
  cancel-in-progress: false

jobs:
  proben:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Chatterbox installieren (CPU)
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet chatterbox-tts
      - name: Hörproben erzeugen
        run: python -u stimme/chatterbox_probe.py
      - name: Speichern
        run: |
          git config user.name "stimme-bot"; git config user.email "stimme-bot@users.noreply.github.com"
          git add stimme/proben2
          git commit -m "Stimme: Chatterbox-Hörproben" || exit 0
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
