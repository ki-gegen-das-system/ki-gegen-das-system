name: "Forschung: Daten übertragen"

# Holt ein Daten-Artefakt, macht es kompakt und legt es auf einen eigenen Zweig (wird nach dem Abholen gelöscht).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Lauf-ID des Daten-Workflows"
        required: true
      teil:
        description: "kern, scanner oder iexcheck"
        required: true
        default: "kern"

permissions:
  contents: write
  actions: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forschung-${{ inputs.teil }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: roh
      - run: pip install numpy pandas
      - env:
          TEIL: ${{ inputs.teil }}
        run: python3 forschung/kompakt.py roh kompakt "$TEIL"
      - name: Auf eigenen Zweig schieben
        env:
          TEIL: ${{ inputs.teil }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd kompakt
          git init -q
          git checkout -q -b "forschung-daten-$TEIL"
          git add -A
          git -c user.name="boersen-bert" -c user.email="boersen-bert@users.noreply.github.com" commit -q -m "Forschungsdaten $TEIL (temporär)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/heads/forschung-daten-$TEIL"
